spring.application.name=SistemaBodega
# configuracion de la conexion a MYSQL
# URL de conexion: servidor, puerto y nombre de la bd
spring.datasource.url=jdbc:mysql://localhost:3306/BDBodega
# usuario de MYSQL
spring.datasource.username=root
#clave del usuario mysql
spring.datasource.password=
# Driver JDBC que permite comunicarse con MYSQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# configuracion de JPA - HIBERNATE
# no crear, modificar ni eliminar las tablas automaticamente
spring.jpa.hibernate.ddl-auto=none

# mostrar en consola las sentencias SQL
spring.jpa.show-sql=true
# dar formato legible a las sentencias SQL
spring.jpa.properties.hibernate.format_sql=true

# la sesion no vence por inactividad (0 = sin limite de tiempo);
# solo termina cuando el usuario cierra sesion o se cierra el navegador
server.servlet.session.timeout=0
# la sesion se maneja solo con cookie (sin ;jsessionid en la URL)
server.servlet.session.tracking-modes=cookie
