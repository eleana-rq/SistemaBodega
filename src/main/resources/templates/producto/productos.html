<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Productos')}">
    <title>Productos</title>
</head>
<body th:replace="~{layout :: panel('productos', ~{::contenido})}">
<div th:fragment="contenido">
    <div class="container-fluid py-4">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold mb-1"><i class="bi bi-box-seam"></i> Gestión de Productos</h2>
            </div>
            <button type="button" class="btn btn-primary" id="btnNuevo">
                <i class="bi bi-plus-circle"></i> Nuevo Producto
            </button>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body">
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="buscar" class="form-label fw-semibold">Buscar producto</label>
                        <div class="input-group caja-busqueda">
                            <span class="input-group-text"><i class="bi bi-search"></i></span>
                            <input type="text" id="buscar" class="form-control">
                        </div>
                    </div>
                </div>
                <div class="w-100 overflow-hidden">
                    <table id="tabla" class="table table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>Código</th>
                                <th>Nombre</th>
                                <th>Categoría</th>
                                <th class="text-end">Precio</th>
                                <th class="text-center">Stock</th>
                                <th class="text-center">Mínimo</th>
                                <th>Estado</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="p : ${listaproductos}">
                                <td th:text="${p.codigo}"></td>
                                <td th:text="${p.nombre}"></td>
                                <td th:text="${p.categoria.nombre}"></td>
                                <td class="text-end" th:text="'S/ ' + ${#numbers.formatDecimal(p.precioVenta, 1, 2, 'POINT')}"></td>
                                <td class="text-center">
                                    <span th:text="${p.stock}" th:classappend="${p.stockBajo} ? 'badge bg-warning text-dark' : ''"></span>
                                </td>
                                <td class="text-center" th:text="${p.stockMinimo}"></td>
                                <td>
                                    <span th:if="${p.estado == 1}" class="badge bg-success">Activo</span>
                                    <span th:if="${p.estado == 0}" class="badge bg-secondary">Inactivo</span>
                                </td>
                                <td class="text-center">
                                    <button type="button" class="btn btn-warning btn-sm" title="Editar"
                                            th:data-id="${p.idProducto}"
                                            th:data-codigo="${p.codigo}"
                                            th:data-nombre="${p.nombre}"
                                            th:data-categoria="${p.categoria.idCategoria}"
                                            th:data-precio="${p.precioVenta}"
                                            th:data-minimo="${p.stockMinimo}"
                                            th:data-estado="${p.estado}"
                                            onclick="editar(this)">
                                        <i class="bi bi-pencil-square"></i>
                                    </button>
                                    <button type="button" class="btn btn-sm"
                                            th:classappend="${p.estado == 1} ? 'btn-danger' : 'btn-success'"
                                            th:title="${p.estado == 1} ? 'Inactivar' : 'Activar'"
                                            th:data-id="${p.idProducto}"
                                            th:data-nombre="${p.nombre}"
                                            th:data-estado="${p.estado}"
                                            onclick="cambiarEstado(this)">
                                        <i class="bi" th:classappend="${p.estado == 1} ? 'bi-slash-circle' : 'bi-check-circle'"></i>
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalForm" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="tituloModal"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="formulario" th:action="@{/registrarproducto}" method="post">
                    <div class="modal-body">
                        <input type="hidden" id="idProducto" name="idProducto">
                        <input type="hidden" id="estado" name="estado" value="1">
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label for="codigo" class="form-label fw-semibold">Código</label>
                                <input type="text" id="codigo" name="codigo" class="form-control" maxlength="20" required>
                            </div>
                            <div class="col-md-8">
                                <label for="nombre" class="form-label fw-semibold">Nombre</label>
                                <input type="text" id="nombre" name="nombre" class="form-control" maxlength="100" required>
                            </div>
                            <div class="col-md-6">
                                <label for="categoria" class="form-label fw-semibold">Categoría</label>
                                <select id="categoria" name="categoria.idCategoria" class="form-select" required>
                                    <option value="">Seleccione una categoría</option>
                                    <option th:each="c : ${listacategorias}"
                                            th:value="${c.idCategoria}"
                                            th:text="${c.nombre}"></option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label for="precioVenta" class="form-label fw-semibold">Precio (S/)</label>
                                <input type="number" id="precioVenta" name="precioVenta" class="form-control"
                                       min="0.01" step="0.01" required>
                            </div>
                            <div class="col-md-3">
                                <label for="stockMinimo" class="form-label fw-semibold">Stock mínimo</label>
                                <input type="number" id="stockMinimo" name="stockMinimo" class="form-control"
                                       min="0" step="1" required>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                            <i class="bi bi-x-circle"></i> Cancelar
                        </button>
                        <button type="submit" class="btn btn-primary" id="btnGuardar"></button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <form id="formEstado" th:action="@{/estadoproducto}" method="post">
        <input type="hidden" id="idEstado" name="id">
    </form>

    <script>
        const tabla = crearTabla("#tabla", "productos");
        conectarBuscador("buscar", tabla);

        const formulario = document.getElementById("formulario");
        const modal = new bootstrap.Modal(document.getElementById("modalForm"));

        // nuevo registro
        document.getElementById("btnNuevo").addEventListener("click", function () {
            document.getElementById("tituloModal").innerHTML = '<i class="bi bi-box-seam"></i> Registrar Producto';
            formulario.action = "/registrarproducto";
            formulario.reset();
            document.getElementById("idProducto").value = "";
            document.getElementById("estado").value = "1";
            document.getElementById("btnGuardar").innerHTML = '<i class="bi bi-save"></i> Guardar';
            modal.show();
        });

        // cargar los datos en el formulario para editar
        function editar(boton) {
            document.getElementById("idProducto").value = boton.dataset.id;
            document.getElementById("codigo").value = boton.dataset.codigo;
            document.getElementById("nombre").value = boton.dataset.nombre;
            document.getElementById("categoria").value = boton.dataset.categoria;
            document.getElementById("precioVenta").value = boton.dataset.precio;
            document.getElementById("stockMinimo").value = boton.dataset.minimo;
            document.getElementById("estado").value = boton.dataset.estado;
            document.getElementById("tituloModal").innerHTML = '<i class="bi bi-pencil-square"></i> Editar Producto';
            formulario.action = "/actualizarproducto";
            document.getElementById("btnGuardar").innerHTML = '<i class="bi bi-save"></i> Actualizar';
            modal.show();
        }

        // activar o inactivar
        function cambiarEstado(boton) {
            const accion = boton.dataset.estado === "1" ? "inactivar" : "activar";
            document.getElementById("idEstado").value = boton.dataset.id;
            confirmarEnvio("formEstado", "¿Desea " + accion + " el producto?",
                           boton.dataset.nombre + (accion === "inactivar" ? " ya no podrá venderse." : ""),
                           "Sí, " + accion);
        }
    </script>
</div>
</body>
</html>
